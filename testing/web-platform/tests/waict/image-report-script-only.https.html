<!doctype html>
<meta charset="utf-8">
<title>WAICT: Script test with blocked-destinations=(script) and invalid manifest in report mode</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<script src="resources/waict-test-helpers.js"></script>
<body>
<script>
  // Test: Script with correct hash, but manifest is invalid due to malformed image hash
  // blocked-destinations=(script) means only scripts are checked
  // However, the malformed hash for incorrect.png makes the entire manifest invalid
  // This affects ALL resources, even those with correct hashes
  // Expected: Script executes in report mode but generates violation report

  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    window.ran = false;

    const script = document.createElement('script');
    const loadPromise = new Promise((resolve) => {
      script.onload = () => resolve();
      script.onerror = () => resolve(); // Also resolve on error to avoid hanging
    });

    script.src = 'resources/correct.js';
    document.body.appendChild(script);

    await loadPromise;
    // Give time for script to execute and reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    assert_true(window.ran, 'Script should execute in report mode even with invalid manifest');

    // Check integrity violation reports
    checkIntegrityViolationReport(reports, 'correct.js', true);
  }, 'Script with correct hash should execute in report mode but generate violation when manifest is invalid due to malformed image hash');
</script>
</body>
