<!DOCTYPE html>
<meta charset="utf-8">
<title>WAICT: Cross-origin WAICT header should be ignored</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<body>
<script>
    // Test that WAICT headers from cross-origin resources are ignored
    //
    // Spec says:
    // "We only care about this header if it's received from a path that matches the top-level origin.
    //  E.g. we're on foo.com and this header is set on the response for foo.com/index.html.
    //  We want to ignore this header if it's received from another origin, e.g. cdn.com/resource.js."
    //
    // Setup:
    // - Top-level page (this page): origin A, NO WAICT header
    // - Cross-origin iframe: origin B (HTTPS_REMOTE_ORIGIN), HAS WAICT header
    // - WAICT header on iframe: mode=enforce, blocked-destinations=(image)
    // - Iframe loads image "incorrect.png" which has wrong hash in manifest
    //
    // Expected behavior per spec:
    // - WAICT header from origin B should be IGNORED (doesn't match top-level origin)
    // - Image should LOAD even though it has incorrect hash in manifest
    // - This is because only same-origin (top-level origin) WAICT headers should be respected

    promise_test(async t => {
        const host_info = get_host_info();

        // Load iframe from cross-origin (www1 subdomain) that has WAICT header
        const iframe = document.createElement('iframe');
        document.body.appendChild(iframe);
        t.add_cleanup(() => iframe.remove());

        // Wait for message from iframe about image load result
        const resultPromise = new Promise((resolve) => {
            window.addEventListener('message', function handler(event) {
                if (event.data.type === 'imageResult') {
                    window.removeEventListener('message', handler);
                    resolve(event.data.loaded);
                }
            });
        });

        // Load from cross-origin with WAICT header
        iframe.src = host_info.HTTPS_REMOTE_ORIGIN + '/waict/resources/iframe-cross-origin-with-policy.html';

        const imageLoaded = await resultPromise;

        // Image should LOAD because cross-origin WAICT header is ignored
        assert_true(imageLoaded, 'Image should load because cross-origin WAICT header is ignored (only top-level origin headers are respected)');

    }, 'WAICT header from cross-origin iframe is ignored (only same-origin headers are respected)');
</script>
</body>
