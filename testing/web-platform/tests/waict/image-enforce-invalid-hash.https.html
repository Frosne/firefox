<!doctype html>
<meta charset="utf-8">
<title>WAICT: Image test with invalid hash format in manifest (enforce mode)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<script src="resources/waict-test-helpers.js"></script>
<body>
<script>
  // Test: Manifest with invalid hash format (too long), blocked-destinations=(image)
  // Invalid hash causes manifest validation to fail
  // In enforce mode: image should be blocked and generate violation report

  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null;

    const imagePromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/correct.png';

    await imagePromise;

    // Wait a bit for reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // In enforce mode, image should be blocked when manifest has invalid hash format
    assert_equals(imageResult, 'failed', 'Image should be blocked when manifest has invalid hash format');

    // Check integrity violation reports
    checkIntegrityViolationReport(reports, 'correct.png', false, "invalid_manifest");
  }, 'Image should fail to load when manifest has invalid hash format for another resource (blocked-destinations=(image), enforce mode)');
</script>
</body>
