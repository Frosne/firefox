<!doctype html>
<meta charset="utf-8">
<title>WAICT: Image test with nonexistent manifest (enforce mode)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<script src="resources/waict-test-helpers.js"></script>
<body>
<script>
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null;

    const imagePromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/correct.png';

    await imagePromise;

    await new Promise(resolve => t.step_timeout(resolve, 100));

    assert_equals(imageResult, 'failed', 'Image should be blocked when manifest file does not exist (enforce mode)');

    checkIntegrityViolationReport(reports, 'correct.png', false, "manifest_unavailable");
  }, 'Image should be blocked when manifest file does not exist (enforce mode)');
</script>
</body>
