<!doctype html>
<meta charset="utf-8">
<title>WAICT: Script test with blocked-destinations=(script) and invalid manifest in enforce mode</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<script src="resources/waict-test-helpers.js"></script>
<body>
<script>
  // Test: Script with correct hash, but manifest is invalid due to malformed image hash
  // blocked-destinations=(script) means only scripts are checked
  // However, the malformed hash for incorrect.png makes the entire manifest invalid
  // This affects ALL resources, even those with correct hashes
  // Expected: Script is blocked in enforce mode because manifest is invalid

  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    window.ran = false;

    const script = document.createElement('script');
    const errorPromise = new Promise((resolve) => {
      script.onerror = () => resolve();
    });

    script.src = 'resources/correct.js';
    document.body.appendChild(script);

    await errorPromise;
    // Give time for potential script execution and reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    assert_false(window.ran, 'Script should be blocked when manifest is invalid, even with correct hash');

    // Check integrity violation reports
    checkIntegrityViolationReport(reports, 'correct.js', false);
  }, 'Script with correct hash should be blocked in enforce mode when manifest is invalid due to malformed image hash');
</script>
</body>
